[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-policy-forge"
version = "0.2.0"
description = "Generate and validate least-privilege security policies for MCP tools."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "mcp-policy-forge maintainers" }]
keywords = ["mcp", "security", "policy", "least-privilege", "ai", "ci"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.scripts]
mcp-policy-forge = "mcp_policy_forge.cli:main"

[project.urls]
Homepage = "https://github.com/yanqr213/mcp-policy-forge"
Repository = "https://github.com/yanqr213/mcp-policy-forge"
Issues = "https://github.com/yanqr213/mcp-policy-forge/issues"
Changelog = "https://github.com/yanqr213/mcp-policy-forge/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]
